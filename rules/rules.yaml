# Client rules. Change these, not the code.
version: 1
client: Ridgeline Waste (fictional)

inputs:
  dispatch_file: dispatch_export.csv
  tickets_folder: tickets
  ticket_extensions: [.txt, .pdf, .png, .jpg, .jpeg]   # other files in tickets/ are skipped with a warning

fees:
  extra_bin: 40.00          # CAD per extra bin
  contamination: 175.00     # CAD flat per contaminated pickup

matching:
  date_tolerance_days: 1    # ticket date may be off by this much
  address_match: normalized # normalized: ignore case, punctuation and the word swaps below | exact: ignore case and spacing only
  address_words:            # whole words treated as the same before comparing; every other word must match
    street: st
    avenue: ave
    road: rd
    boulevard: blvd
    crescent: cres
    drive: dr
    lane: ln

review:
  send_low_confidence_to_review: true
  approval_threshold_cad: 5000   # invoices above this need manager sign-off

model:
  name: claude-sonnet-5-5
  effort: low               # low | medium | high | xhigh | max. Thinking is on (adaptive); effort sets how hard it thinks
  max_tokens: 4000          # thinking + answer must fit; a cut-off answer becomes a low-confidence row
